name: release

# Publishes the provider binaries that scripts/install.sh downloads.
#
# Runs on macOS Apple Silicon because the Mac agent links llama.cpp via cgo and
# must be built on the target architecture. The Linux binaries are pure Go
# (CGO_ENABLED=0), so they cross-compile from the same runner.
#
# MANUAL DISPATCH ONLY, deliberately. On a private repo GitHub bills macOS
# minutes at 10x, and a cold llama.cpp build can consume a whole month's free
# allowance in one run. A `push: tags` trigger would spend that every time a
# version tag was pushed, silently. Cut releases with scripts/publish.sh
# instead; re-enable the tag trigger if this repo becomes public, where
# Actions is free.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.1.0)"
        required: true

permissions:
  contents: write # required to create the release

jobs:
  release:
    runs-on: macos-14 # Apple Silicon
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      # llama.cpp takes several minutes to build. It is pinned to a commit in
      # fetch-llama.sh, so that file's hash is a correct cache key: bumping the
      # pin invalidates the cache, and nothing else does.
      - name: Cache llama.cpp build
        uses: actions/cache@v4
        with:
          path: agent/internal/engine/third_party/llama.cpp
          key: llama-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/fetch-llama.sh') }}

      # contracts/gen is generated, not committed, so a fresh checkout has no
      # Go code to build until this runs. buf.gen.yaml uses remote plugins, so
      # buf itself is the only tool needed. Pinned to match local development.
      - name: Install buf
        env:
          BUF_VERSION: 1.71.0
        run: |
          curl -fsSL -o /usr/local/bin/buf \
            "https://github.com/bufbuild/buf/releases/download/v${BUF_VERSION}/buf-$(uname -s)-$(uname -m)"
          chmod +x /usr/local/bin/buf
          buf --version

      - name: Generate protobuf code
        run: make proto

      - name: Build the Metal engine
        run: make engine

      # Never publish binaries that have not passed the suite.
      - name: Test
        run: make test

      - name: Build release artifacts
        run: make release

      - name: Verify checksums
        working-directory: dist
        run: shasum -a 256 -c SHA256SUMS

      # `doctor` initialises Metal through cgo and exits non-zero if the GPU
      # is unusable, so this catches a broken link that `go build` accepts.
      # (Piping to `head` here would mask the exit code entirely.)
      - name: Smoke-test the macOS binary
        run: ./dist/gridlink-agent-darwin-arm64 doctor

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            dist/gridlink-agent-darwin-arm64 \
            dist/gridlink-agent-linux-arm64 \
            dist/gridlink-agent-linux-amd64 \
            dist/SHA256SUMS
